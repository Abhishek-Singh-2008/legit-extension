<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <!-- Header -->
      <header class="header">
        <div class="header__logo">
          <img src="../icons/icon32.png" alt="Legit" class="header__icon" />
          <span class="header__title">Legit</span>
        </div>
        <span id="status-badge" class="badge badge--disconnected">Not connected</span>
      </header>

      <!-- Current Problem -->
      <section class="section" id="problem-section">
        <p class="section__label">Current Problem</p>
        <div id="problem-detected" class="problem hidden">
          <div class="problem__header">
            <span id="problem-title" class="problem__title">—</span>
            <span id="problem-difficulty" class="problem__badge">—</span>
          </div>
          <span id="problem-slug" class="problem__slug">—</span>
          <span class="problem__status">✓ Problem detected</span>
        </div>
        <div id="problem-none">
          <span class="problem__empty">No LeetCode problem detected.</span>
          <span class="problem__hint">Open a problem page on LeetCode.</span>
        </div>
      </section>

      <!-- GitHub Account -->
      <section class="section" id="account-section">
        <p class="section__label">GitHub Account</p>
        <div id="account-connected" class="account hidden">
          <img id="account-avatar" class="account__avatar" src="" alt="" />
          <span class="account__check">✓</span>
          <span id="github-username" class="account__name">Loading…</span>
        </div>
        <div id="account-disconnected">
          <button id="connect-btn" class="btn btn--primary btn--full">
            Connect GitHub
          </button>
        </div>
      </section>

      <!-- Repository & Branch -->
      <section class="section" id="repo-section">
        <p class="section__label">Repository</p>
        <div class="input-row">
          <span id="repo-display" class="input-display">—</span>
        </div>
      </section>

      <section class="section">
        <p class="section__label">Branch</p>
        <span id="branch-display" class="input-display">—</span>
      </section>

      <!-- Auto Sync Toggle -->
      <section class="section section--row">
        <p class="section__label">Auto Sync</p>
        <label class="toggle" for="auto-sync-toggle">
          <input type="checkbox" id="auto-sync-toggle" />
          <span class="toggle__track"></span>
        </label>
      </section>

      <!-- Stats Summary (Phase 10) -->
      <section class="section" id="stats-section">
        <div class="section__header">
          <p class="section__label">Sync Summary</p>
        </div>
        <div class="stats-summary">
          <div class="stats-summary__item">
            <span id="stats-total" class="stats-summary__value">0</span>
            <span class="stats-summary__label">Total Syncs</span>
          </div>
          <div class="stats-summary__item">
            <span id="stats-rate" class="stats-summary__value">0%</span>
            <span class="stats-summary__label">Success Rate</span>
          </div>
        </div>
      </section>

      <!-- Recent Sync History (Phase 10) -->
      <section class="section" id="history-section">
        <div class="section__header">
          <p class="section__label">Recent Syncs (Latest 5)</p>
          <button id="clear-history-popup-btn" class="btn--link" title="Clear history">Clear</button>
        </div>
        <div id="history-list" class="history-list">
          <span class="history-list__empty">No sync history yet</span>
        </div>
      </section>

      <!-- Actions -->
      <div class="actions">
        <button id="test-btn" class="btn btn--secondary">
          Test Connection
        </button>
        <button id="settings-btn" class="btn btn--ghost">
          Open Settings / Dashboard
        </button>
      </div>

      <!-- Version -->
      <footer class="footer">
        <span class="footer__version" id="version-label">v1.0.0</span>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
